openapi: 3.1.0
info:
  title: TrustForge AI API
  version: 0.1.0
  description: Evidence-backed trust registry API. This contract will expand without moving domain logic into the transport layer.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }
  /companies:
    get:
      operationId: listCompanies
      summary: List or search companies
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Company page }
    post:
      operationId: createCompany
      summary: Create a company from an authorised organisation
      responses:
        "201": { description: Company created }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
  /companies/{id}:
    get:
      operationId: getCompany
      summary: Get a company by UUID or slug
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Company }
        "404": { description: Company not found }
  /products:
    get:
      operationId: listProducts
      summary: List or search typed AI products
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: type, schema: { $ref: "#/components/schemas/ProductType" } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Product page }
    post:
      operationId: createProduct
      summary: Create a typed AI product
      responses:
        "201": { description: Product created }
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get a product by UUID or slug
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Product }
        "404": { description: Product not found }
  /search:
    get:
      operationId: searchRegistry
      summary: Search companies and all AI product types
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2 } }
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: verified, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Search results }
  /evidence:
    get:
      operationId: listEvidence
      summary: List evidence for a registry subject
      parameters:
        - { in: query, name: subjectType, required: true, schema: { type: string } }
        - { in: query, name: subjectId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Evidence records in observation order }
    post:
      operationId: submitEvidence
      summary: Submit versioned evidence
      responses:
        "201": { description: Evidence submitted for adjudication }
  /evidence/{id}/adjudicate:
    post:
      operationId: adjudicateEvidence
      summary: Verify or reject pending evidence
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Evidence adjudicated }
  /claims:
    post:
      operationId: createVendorClaim
      summary: Start a replay-resistant vendor claim challenge
      responses:
        "201": { description: Claim challenge created }
  /claims/{id}/verify:
    post:
      operationId: verifyVendorClaim
      summary: Verify a vendor claim through its selected channel
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Claim verification result }
  /reviews:
    get:
      operationId: listReviews
      summary: List published subject reviews
      responses:
        "200": { description: Published reviews }
    post:
      operationId: submitReview
      summary: Submit a structured community review
      responses:
        "201": { description: Review submitted or published }
  /trust-scores/{subjectType}/{subjectId}:
    get:
      operationId: getTrustScore
      summary: Get the current score and immutable calculation history
      parameters:
        - { in: path, name: subjectType, required: true, schema: { type: string } }
        - { in: path, name: subjectId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Current score and history }
  /mcp-servers:
    get:
      operationId: listMcpServers
      summary: Find MCP servers with transport and readiness filters
      responses:
        "200": { description: MCP server profiles with permission risk and Trust Scores }
    post:
      operationId: createMcpServer
      summary: Register an MCP server and its explicit permissions
      responses:
        "201": { description: MCP server registered }
  /skills:
    get: { operationId: listSkills, summary: List AI skills, responses: { "200": { description: Skill profiles } } }
    post: { operationId: createSkill, summary: Register an AI skill, responses: { "201": { description: Skill registered } } }
  /agents:
    get: { operationId: listAgents, summary: List AI agents, responses: { "200": { description: Agent profiles } } }
    post: { operationId: createAgent, summary: Register an AI agent, responses: { "201": { description: Agent registered } } }
  /models:
    get: { operationId: listModels, summary: List AI models, responses: { "200": { description: Model profiles } } }
    post: { operationId: createModel, summary: Register an AI model, responses: { "201": { description: Model registered } } }
  /apis:
    get: { operationId: listApis, summary: List AI APIs, responses: { "200": { description: API profiles } } }
    post: { operationId: createApi, summary: Register an AI API, responses: { "201": { description: API registered } } }
  /security/advisories:
    get: { operationId: listSecurityAdvisories, summary: List attributed security advisories, responses: { "200": { description: Advisory records and source snapshots } } }
    post: { operationId: upsertSecurityAdvisory, summary: Ingest a source-attributed advisory, responses: { "201": { description: Advisory stored or refreshed } } }
  /security/findings:
    get: { operationId: listSecurityFindings, summary: List observed security findings for a subject, responses: { "200": { description: Findings, status, and source material } } }
    post: { operationId: observeSecurityFinding, summary: Record or refresh a deduplicated scanner finding, responses: { "201": { description: Finding observed } } }
  /security/findings/{id}/adjudicate:
    post: { operationId: adjudicateSecurityFinding, summary: Mark a finding as accepted risk, false positive, resolved, or not affected, responses: { "200": { description: Finding adjudicated } } }
  /security/sboms:
    post: { operationId: importSbom, summary: Import a reproducible CycloneDX or SPDX software bill of materials, responses: { "201": { description: SBOM and normalised components stored } } }
  /monitoring/targets:
    get: { operationId: listMonitoringTargets, summary: List tenant monitoring targets, responses: { "200": { description: Monitoring targets } } }
    post: { operationId: createMonitoringTarget, summary: Create or re-enable an idempotent monitoring target, responses: { "201": { description: Monitoring target configured } } }
  /monitoring/subscriptions:
    post: { operationId: subscribeToMonitoring, summary: Subscribe the active user to subject change events, responses: { "201": { description: Subscription configured } } }
  /monitoring/trigger:
    post: { operationId: triggerMonitoring, summary: Queue due monitoring checks for an authorised tenant, responses: { "202": { description: Due checks queued } } }
  /ai-evaluations/suites:
    post: { operationId: createAiEvaluationSuite, summary: Version a controlled AI security evaluation suite, responses: { "201": { description: Suite and hashed cases created } } }
  /ai-evaluations/runs:
    get: { operationId: listAiEvaluationRuns, summary: List versioned lab results for a subject, responses: { "200": { description: Evaluation runs } } }
    post: { operationId: recordAiEvaluationRun, summary: Record a controlled or chain-of-custody imported evaluation run, responses: { "201": { description: Evaluation run stored } } }
components:
  schemas:
    ProductType:
      type: string
      enum: [application, mcp_server, skill, agent, model, api, developer_tool]
