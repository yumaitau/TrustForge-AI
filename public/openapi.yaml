openapi: 3.1.0
info:
  title: TrustForge AI API
  version: 0.1.0
  description: Evidence-backed trust registry API. This contract will expand without moving domain logic into the transport layer.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }
  /companies:
    get:
      operationId: listCompanies
      summary: List or search companies
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Company page }
    post:
      operationId: createCompany
      summary: Create a company from an authorised organisation
      responses:
        "201": { description: Company created }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
  /companies/{id}:
    get:
      operationId: getCompany
      summary: Get a company by UUID or slug
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Company }
        "404": { description: Company not found }
  /products:
    get:
      operationId: listProducts
      summary: List or search typed AI products
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: type, schema: { $ref: "#/components/schemas/ProductType" } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Product page }
    post:
      operationId: createProduct
      summary: Create a typed AI product
      responses:
        "201": { description: Product created }
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get a product by UUID or slug
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Product }
        "404": { description: Product not found }
  /search:
    get:
      operationId: searchRegistry
      summary: Search companies and all AI product types
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2 } }
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: verified, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Search results }
  /evidence:
    get:
      operationId: listEvidence
      summary: List evidence for a registry subject
      parameters:
        - { in: query, name: subjectType, required: true, schema: { type: string } }
        - { in: query, name: subjectId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Evidence records in observation order }
    post:
      operationId: submitEvidence
      summary: Submit versioned evidence
      responses:
        "201": { description: Evidence submitted for adjudication }
  /evidence/{id}/adjudicate:
    post:
      operationId: adjudicateEvidence
      summary: Verify or reject pending evidence
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Evidence adjudicated }
  /claims:
    post:
      operationId: createVendorClaim
      summary: Start a replay-resistant vendor claim challenge
      responses:
        "201": { description: Claim challenge created }
  /claims/{id}/verify:
    post:
      operationId: verifyVendorClaim
      summary: Verify a vendor claim through its selected channel
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Claim verification result }
  /reviews:
    get:
      operationId: listReviews
      summary: List published subject reviews
      responses:
        "200": { description: Published reviews }
    post:
      operationId: submitReview
      summary: Submit a structured community review
      responses:
        "201": { description: Review submitted or published }
  /trust-scores/{subjectType}/{subjectId}:
    get:
      operationId: getTrustScore
      summary: Get the current score and immutable calculation history
      parameters:
        - { in: path, name: subjectType, required: true, schema: { type: string } }
        - { in: path, name: subjectId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Current score and history }
  /mcp-servers:
    get:
      operationId: listMcpServers
      summary: Find MCP servers with transport and readiness filters
      responses:
        "200": { description: MCP server profiles with permission risk and Trust Scores }
    post:
      operationId: createMcpServer
      summary: Register an MCP server and its explicit permissions
      responses:
        "201": { description: MCP server registered }
  /skills:
    get: { operationId: listSkills, summary: List AI skills, responses: { "200": { description: Skill profiles } } }
    post: { operationId: createSkill, summary: Register an AI skill, responses: { "201": { description: Skill registered } } }
  /agents:
    get: { operationId: listAgents, summary: List AI agents, responses: { "200": { description: Agent profiles } } }
    post: { operationId: createAgent, summary: Register an AI agent, responses: { "201": { description: Agent registered } } }
  /models:
    get: { operationId: listModels, summary: List AI models, responses: { "200": { description: Model profiles } } }
    post: { operationId: createModel, summary: Register an AI model, responses: { "201": { description: Model registered } } }
  /apis:
    get: { operationId: listApis, summary: List AI APIs, responses: { "200": { description: API profiles } } }
    post: { operationId: createApi, summary: Register an AI API, responses: { "201": { description: API registered } } }
  /security/advisories:
    get: { operationId: listSecurityAdvisories, summary: List attributed security advisories, responses: { "200": { description: Advisory records and source snapshots } } }
    post: { operationId: upsertSecurityAdvisory, summary: Ingest a source-attributed advisory, responses: { "201": { description: Advisory stored or refreshed } } }
  /security/findings:
    get: { operationId: listSecurityFindings, summary: List observed security findings for a subject, responses: { "200": { description: Findings, status, and source material } } }
    post: { operationId: observeSecurityFinding, summary: Record or refresh a deduplicated scanner finding, responses: { "201": { description: Finding observed } } }
  /security/findings/{id}/adjudicate:
    post: { operationId: adjudicateSecurityFinding, summary: Mark a finding as accepted risk, false positive, resolved, or not affected, responses: { "200": { description: Finding adjudicated } } }
  /security/sboms:
    post: { operationId: importSbom, summary: Import a reproducible CycloneDX or SPDX software bill of materials, responses: { "201": { description: SBOM and normalised components stored } } }
  /monitoring/targets:
    get: { operationId: listMonitoringTargets, summary: List tenant monitoring targets, responses: { "200": { description: Monitoring targets } } }
    post: { operationId: createMonitoringTarget, summary: Create or re-enable an idempotent monitoring target, responses: { "201": { description: Monitoring target configured } } }
  /monitoring/subscriptions:
    post: { operationId: subscribeToMonitoring, summary: Subscribe the active user to subject change events, responses: { "201": { description: Subscription configured } } }
  /monitoring/trigger:
    post: { operationId: triggerMonitoring, summary: Queue due monitoring checks for an authorised tenant, responses: { "202": { description: Due checks queued } } }
  /ai-evaluations/suites:
    post: { operationId: createAiEvaluationSuite, summary: Version a controlled AI security evaluation suite, responses: { "201": { description: Suite and hashed cases created } } }
  /ai-evaluations/runs:
    get: { operationId: listAiEvaluationRuns, summary: List versioned lab results for a subject, responses: { "200": { description: Evaluation runs } } }
    post: { operationId: recordAiEvaluationRun, summary: Record a controlled or chain-of-custody imported evaluation run, responses: { "201": { description: Evaluation run stored } } }
  /skills/{id}:
    get: { operationId: getSkill, summary: Get a skill with its profile by id or slug, parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], responses: { "200": { description: Skill profile }, "404": { $ref: "#/components/responses/NotFound" } } }
  /agents/{id}:
    get: { operationId: getAgent, summary: Get an agent with its profile by id or slug, parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], responses: { "200": { description: Agent profile }, "404": { $ref: "#/components/responses/NotFound" } } }
  /models/{id}:
    get: { operationId: getModel, summary: Get a model with its profile by id or slug, parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], responses: { "200": { description: Model profile }, "404": { $ref: "#/components/responses/NotFound" } } }
  /apis/{id}:
    get: { operationId: getApi, summary: Get an API offering with its profile by id or slug, parameters: [ { in: path, name: id, required: true, schema: { type: string } } ], responses: { "200": { description: API profile }, "404": { $ref: "#/components/responses/NotFound" } } }
  /trust-scores/{subjectType}/{subjectId}/recalculate:
    post: { operationId: recalculateTrustScore, summary: Recalculate and persist a subject's trust score, parameters: [ { in: path, name: subjectType, required: true, schema: { type: string } }, { in: path, name: subjectId, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Score recalculated }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /claims/{id}/revoke:
    post: { operationId: revokeVendorClaim, summary: Revoke a verified vendor claim, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Claim revoked }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /evidence/{id}/challenges:
    post: { operationId: challengeEvidence, summary: Challenge a piece of evidence, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "201": { description: Challenge recorded }, "401": { $ref: "#/components/responses/Unauthorized" }, "422": { $ref: "#/components/responses/ValidationError" } } }
  /reviews/{id}/vote:
    post: { operationId: voteOnReview, summary: Vote a published review helpful or not, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Vote recorded }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /reviews/{id}/appeal:
    post: { operationId: appealReview, summary: Appeal a moderated review, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Appeal opened }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /reviews/{id}/adjudicate:
    post: { operationId: adjudicateReview, summary: Publish or reject a fraud-flagged review, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Review adjudicated }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /edits:
    post: { operationId: submitSuggestedEdit, summary: Suggest an edit to a registry subject, responses: { "201": { description: Edit submitted }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /edits/{id}/adjudicate:
    post: { operationId: adjudicateSuggestedEdit, summary: Publish or reject a suggested edit, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Edit adjudicated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /reports:
    post: { operationId: reportContent, summary: Report content for moderation, responses: { "201": { description: Report filed } } }
  /moderation/{id}/transition:
    post: { operationId: transitionModerationCase, summary: Transition a moderation case, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Case updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /recommendations:
    post: { operationId: recommendForQuestion, summary: Explainable recommendation for a natural-language question, responses: { "200": { description: Ranked recommendation with rationale }, "400": { $ref: "#/components/responses/ValidationError" } } }
  /mcp-servers/{id}/releases:
    get: { operationId: listMcpReleases, summary: List releases for an MCP server, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Releases } } }
    post: { operationId: addMcpRelease, summary: Record an MCP server release, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "201": { description: Release recorded }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /mcp-servers/{id}/dependencies:
    get: { operationId: listMcpDependencies, summary: List dependencies for an MCP server, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Dependencies } } }
    post: { operationId: addMcpDependency, summary: Record an MCP server dependency, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "201": { description: Dependency recorded }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /compliance/frameworks:
    post: { operationId: importComplianceFramework, summary: Import a compliance framework and controls, responses: { "201": { description: Framework imported }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /compliance/assessments:
    post: { operationId: createComplianceAssessment, summary: Create a compliance assessment, responses: { "201": { description: Assessment created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /enterprise/catalogues:
    post: { operationId: createEnterpriseCatalogue, summary: Create an enterprise catalogue, responses: { "201": { description: Catalogue created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /enterprise/catalogue-entries:
    post: { operationId: createCatalogueEntry, summary: Add an entry to an enterprise catalogue, responses: { "201": { description: Entry created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /enterprise/policies:
    post: { operationId: createEnterprisePolicy, summary: Create an enterprise policy, responses: { "201": { description: Policy created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /enterprise/requests:
    get: { operationId: listEnterpriseRequests, summary: List procurement requests, responses: { "200": { description: Requests }, "403": { $ref: "#/components/responses/Forbidden" } } }
    post: { operationId: createEnterpriseRequest, summary: Raise a procurement request, responses: { "201": { description: Request created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /enterprise/requests/{id}/decisions:
    post: { operationId: decideEnterpriseRequest, summary: Record a decision on a procurement request, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "201": { description: Decision recorded }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /enterprise/audit-exports:
    post: { operationId: createAuditExport, summary: Produce a signed audit evidence export, responses: { "201": { description: Export produced }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/sellers:
    post: { operationId: createSellerProfile, summary: Create a marketplace seller profile, responses: { "201": { description: Seller profile created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/sellers/{id}/status:
    post: { operationId: setSellerStatus, summary: Change a seller profile status, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Seller status changed }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/listings:
    get: { operationId: listMarketplaceListings, summary: Public ranked marketplace listings, responses: { "200": { description: Organic and sponsored listings } } }
    post: { operationId: createListing, summary: Create a marketplace listing, responses: { "201": { description: Listing created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/listings/{id}/publish:
    post: { operationId: publishListing, summary: Publish a draft listing, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Listing published }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/offers:
    post: { operationId: createOffer, summary: Create an offer on a listing, responses: { "201": { description: Offer created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/placements:
    post: { operationId: createSponsoredPlacement, summary: Create a disclosed sponsored placement, responses: { "201": { description: Placement created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/orders:
    post: { operationId: createOrder, summary: Place an order against an offer, responses: { "201": { description: Order placed }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /marketplace/disputes:
    post: { operationId: openDispute, summary: Open a dispute as a party to a listing or order, responses: { "201": { description: Dispute opened }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /marketplace/disputes/{id}:
    patch: { operationId: resolveDispute, summary: Resolve a dispute as the seller organisation, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Dispute updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /mobile/devices:
    post: { operationId: registerDevice, summary: Register a mobile device for push, responses: { "201": { description: Device registered }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /mobile/devices/{id}:
    delete: { operationId: removeDevice, summary: Remove a mobile device, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Device removed }, "404": { $ref: "#/components/responses/NotFound" } } }
  /mobile/preferences:
    get: { operationId: listAlertPreferences, summary: List the user's alert preferences, responses: { "200": { description: Alert preferences }, "401": { $ref: "#/components/responses/Unauthorized" } } }
    put: { operationId: upsertAlertPreference, summary: Upsert an alert preference, responses: { "200": { description: Preference saved }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /mobile/favorites:
    get: { operationId: listFavorites, summary: List the user's favourites, responses: { "200": { description: Favourites }, "401": { $ref: "#/components/responses/Unauthorized" } } }
    post: { operationId: addFavorite, summary: Add a favourite subject, responses: { "201": { description: Favourite added }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /mobile/favorites/{id}:
    delete: { operationId: removeFavorite, summary: Remove a favourite, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Favourite removed }, "404": { $ref: "#/components/responses/NotFound" } } }
  /mobile/alerts:
    get: { operationId: listAlerts, summary: List the user's trust alerts, responses: { "200": { description: Alerts }, "401": { $ref: "#/components/responses/Unauthorized" } } }
    post: { operationId: enqueueAlert, summary: Enqueue a trust change alert, responses: { "201": { description: Alert enqueued } } }
  /research/proposals:
    get: { operationId: listResearchProposals, summary: List research proposals, responses: { "200": { description: Proposals } } }
    post: { operationId: createResearchProposal, summary: Create a research proposal, responses: { "201": { description: Proposal created }, "401": { $ref: "#/components/responses/Unauthorized" } } }
  /research/proposals/{id}:
    patch: { operationId: transitionResearchProposal, summary: Transition a research proposal, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { description: Proposal updated }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /research/proposals/{id}/reviews:
    post: { operationId: reviewResearchProposal, summary: Record an ethics or security review of a proposal, parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ], responses: { "201": { description: Review recorded }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /operations/offline-bundles/verify:
    post: { operationId: verifyOfflineBundle, summary: Verify a signed air-gapped offline bundle, responses: { "200": { description: Bundle verification result }, "422": { $ref: "#/components/responses/ValidationError" } } }
components:
  schemas:
    ProductType:
      type: string
      enum: [application, mcp_server, skill, agent, model, api, developer_tool]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    CursorPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        nextCursor: { type: [string, "null"], format: uuid }
  responses:
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ValidationError: { description: Request failed validation, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
