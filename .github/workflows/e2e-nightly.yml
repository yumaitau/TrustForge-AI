name: E2E nightly

# Browser and end-to-end tests run here only, never in push or pull request CI.
on:
  schedule:
    - cron: '0 15 * * *' # 02:00 AEDT
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trustforge_ci
          POSTGRES_USER: trustforge
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trustforge -d trustforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://trustforge:ci@localhost:5432/trustforge_ci
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
