services:
  web:
    build: .
    environment:
      DATABASE_URL: postgres://trustforge:dev@postgres:5432/trustforge_dev
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-compose-secret-change-before-deploy}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      DATABASE_URL: postgres://trustforge:dev@postgres:5432/trustforge_dev
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3100
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp
      MCP_API_TOKEN: ${MCP_API_TOKEN:-development-mcp-token}
    ports: ["${MCP_PORT:-3100}:3100"]
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustforge_dev
      POSTGRES_USER: trustforge
      POSTGRES_PASSWORD: dev
    ports: ["${POSTGRES_PORT:-55436}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustforge -d trustforge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  object-storage:
    # Upstream minio/minio is archived and affected by CVE-2026-122267; use the Chainguard build
    # (fix landed in RELEASE.2026-09-22T19-25-18Z). Pinned to the multi-arch index digest of
    # :latest as built 2026-11-04; refresh the digest deliberately when bumping.
    image: cgr.dev/chainguard/minio:latest@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: trustforge
      MINIO_ROOT_PASSWORD: trustforge-dev-only
    ports: ["${S3_PORT:-19020}:9000", "${S3_CONSOLE_PORT:-19021}:9001"]
    volumes: ["object_data:/data"]
volumes:
  postgres_data:
  redis_data:
  object_data:
